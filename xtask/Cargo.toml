[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
earcutr = "0.5.0"
fontdue = "0.9"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ttf-parser = "0.25.1"
uuid = { version = "1", features = ["v5"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
