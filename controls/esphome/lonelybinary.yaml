# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: lonelybinary
  friendly_name: LonelyBinary
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: onboard_rgb
          brightness: 25%
          effect: Aurora

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  baud_rate: 0

api:
  encryption:
    key: !secret lonelybinary_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LonelyBinary Fallback Hotspot
    password: !secret lonelybinary_fallback_password

captive_portal:

packages:
  learning_bench: !include common/lonelybinary-learning-bench.yaml

light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: Onboard RGB
    pin: GPIO48
    num_leds: 1
    rmt_symbols: 48
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: Aurora
          update_interval: 50ms
          lambda: |-
            const float phase = (millis() % 12000) * 0.000523599f;
            it[0] = Color(
                static_cast<uint8_t>(70 + 65 * sinf(phase)),
                static_cast<uint8_t>(100 + 90 * sinf(phase + 2.094395f)),
                static_cast<uint8_t>(170 + 80 * sinf(phase + 4.188790f)));
      - addressable_rainbow:
          name: Rainbow
          speed: 5
          width: 1
